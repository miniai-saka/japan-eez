plugins { id 'fabric-loom' version '1.6.12'; id 'maven-publish' }
version = '1.0.0'
group = 'io.github.miniai_saka'
base { archivesName = 'japan-eez-1.20.1' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
loom { runs { client { runDir 'run-client' }; server { runDir 'run-server' } } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
test { useJUnitPlatform() }
sourceSets {
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('qaJar', Jar) { dependsOn qaClasses; archiveClassifier = 'qa-dev'; from sourceSets.qa.output }
tasks.register('remapQaJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn qaJar; inputFile = tasks.qaJar.archiveFile; archiveClassifier = 'qa'; addNestedDependencies = false
    classpath.from(sourceSets.main.output)
}

// Include the project license in the distributable JAR.
tasks.named('jar') { from('LICENSE') }
